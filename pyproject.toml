[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-search"
version = "0.0.1"
description = "Search over connected graphs satisfying radius-r ball constraints"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
]

[project.optional-dependencies]
draw = ["matplotlib>=3.7"]
dev = ["pytest>=8", "hypothesis>=6", "maturin>=1.5,<2"]
# The Rust extension (graph_search_rs) is built separately: see rust/README.md.

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["balltype", "compiled", "draw", "extract", "report", "ruleset", "ruleset_io"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
