[package]
name = "graph-search-core"
description = "Compiled rulesets and graph search for radius-r ball constraints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "graph_search_core"

[dependencies]
# nauty 2.9, compiled from bundled C source. Needs a C compiler, and libclang
# for the generated bindings (on macOS both come with the Xcode command-line tools).
nauty-Traces-sys = "0.11"

[dev-dependencies]
# Only for reading the shared JSON fixtures in tests/fixtures.rs.
serde_json = "1"
